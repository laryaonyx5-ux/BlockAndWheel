
name: Build Color Wheel Mod

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler le mod
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Recuperer le fichier JAR
        uses: actions/upload-artifact@v4
        with:
          name: colorwheel-mod
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
